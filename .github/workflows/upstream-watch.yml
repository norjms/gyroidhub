# Watches GyroidVault for a new release (never a pre-release, a draft, a branch or a nightly). When one is out,
# it runs the conversion against it and opens a pull request moving upstream.env to it. If the conversion no
# longer applies, the pull request says which step failed, so convert/convert.py can be fixed on its branch.
# Images are built by the maintainer from the merged upstream.env, never here.
name: upstream-watch

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./upstream.env
          tag="$(gh api repos/TeeCodeDev/GyroidVault/releases/latest --jq .tag_name)"
          echo "current=$GYROIDVAULT_VERSION latest=$tag"
          if [ "$tag" = "$GYROIDVAULT_VERSION" ]; then echo "new=" >> "$GITHUB_OUTPUT"; exit 0; fi
          sha="$(gh api "repos/TeeCodeDev/GyroidVault/commits/$tag" --jq .sha)"
          echo "new=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Convert it
        id: convert
        if: steps.latest.outputs.new != ''
        continue-on-error: true
        run: |
          git clone -q --depth 1 --branch "${{ steps.latest.outputs.new }}" https://github.com/TeeCodeDev/GyroidVault.git /tmp/src
          test "$(git -C /tmp/src rev-parse HEAD)" = "${{ steps.latest.outputs.sha }}"
          python3 convert/convert.py /tmp/src 2>&1 | tee /tmp/convert.log

      - name: Open the pull request
        if: steps.latest.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.new }}
          SHA: ${{ steps.latest.outputs.sha }}
          OUTCOME: ${{ steps.convert.outcome }}
        run: |
          branch="upstream/$TAG"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then echo "already proposed"; exit 0; fi
          sed -i "s/^GYROIDVAULT_VERSION=.*/GYROIDVAULT_VERSION=$TAG/; s/^GYROIDVAULT_COMMIT=.*/GYROIDVAULT_COMMIT=$SHA/" upstream.env
          git config user.name "James Norman"
          git config user.email "3048818+norjms@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qam "GyroidVault $TAG"
          git push -q origin "$branch"
          if [ "$OUTCOME" = success ]; then
            body="GyroidVault $TAG ($SHA) is released. convert/convert.py applies to it cleanly. Build it with build/release.sh gyroidhub in openprinthq-deploy, check it, then merge."
          else
            body="GyroidVault $TAG ($SHA) is released, and convert/convert.py does not apply to it yet:"$'\n\n```\n'"$(tail -20 /tmp/convert.log)"$'\n```\n\n'"Fix the anchors on this branch, then build and check it."
          fi
          gh pr create --head "$branch" --title "GyroidVault $TAG" --body "$body" \
            || gh issue create --title "GyroidVault $TAG is out" --body "$body (branch $branch)"
